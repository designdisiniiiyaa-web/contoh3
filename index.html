<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Interactive Galaxy 💗</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #05000a;
      color: white;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99999;
    }

    /* ================= MUSIK ================= */
    .music-player {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 100001;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 0, 127, 0.25);
      border: 1px solid rgba(255, 77, 166, 0.5);
      padding: 6px 14px 6px 6px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
      user-select: none;
    }

    .music-player:hover {
      transform: scale(1.05);
      background: rgba(255, 0, 127, 0.45);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
    }

    .music-cover {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #ffb3da;
      animation: spinCover 4s linear infinite;
    }

    .music-player.paused .music-cover {
      animation-play-state: paused;
      opacity: 0.7;
    }

    @keyframes spinCover {
      to { transform: rotate(360deg); }
    }

    .music-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .music-title {
      font-size: 0.8rem;
      font-weight: bold;
      color: #fff;
      line-height: 1.1;
    }

    .music-artist {
      font-size: 0.65rem;
      color: #ffb3da;
    }

    /* ================= HEADER GALAXY ================= */
    .ui-header {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    .ui-header h1 {
      font-size: 2.2rem;
      font-family: "Poppins", sans-serif;
      text-shadow: 0 0 15px #ff007f;
      color: #fff;
    }

    .ui-header p {
      font-size: 0.9rem;
      color: #ffb3da;
      margin-top: 4px;
    }

    .instruction {
      position: absolute;
      bottom: 25px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      font-size: 0.85rem;
      color: #ffa6d5;
      letter-spacing: 1px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* ================= MODAL ================= */
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 100002;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .card {
      background: linear-gradient(135deg, #420027, #12000c);
      border: 1px solid #ff4da6;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      max-width: 320px;
      width: 85%;
      box-shadow: 0 0 30px #ff007f;
      position: relative;
      animation: pop 0.3s ease;
    }

    @keyframes pop {
      from {
        transform: scale(0.7);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .card img {
      width: 100%;
      max-height: 180px;
      border-radius: 12px;
      object-fit: contain;
      border: 2px solid #ff80bf;
    }

    .card h2 {
      margin-top: 10px;
      font-size: 1.3rem;
      color: #ffb3da;
    }

    .card p {
      margin-top: 10px;
      font-size: 0.85rem;
      line-height: 1.5;
      color: #ffe6f2;
    }

    .close-btn {
      position: absolute;
      top: 8px;
      right: 12px;
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 5;
    }

    /* ================= PIN ================= */
    #passkey-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #2e001c 0%, #12000c 70%, #05000a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100000;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #passkey-screen.hide {
      opacity: 0;
      visibility: hidden;
    }

    .pin-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(90%, 340px);
      background: rgba(40, 0, 25, 0.55);
      border: 1px solid rgba(255, 0, 127, 0.4);
      padding: 30px 20px;
      border-radius: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.25);
    }

    .pin-flower {
      font-size: 40px;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 10px #ff007f);
    }

    .pin-title {
      font-family: "Poppins", sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 12px #ff007f;
      margin-bottom: 4px;
    }

    .pin-subtitle {
      font-size: 13px;
      color: #ffb3da;
      margin-bottom: 20px;
    }

    .pin-dots {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #ff4da6;
      background: transparent;
      transition: all 0.2s ease;
    }

    .dot.filled {
      background: #ff007f;
      border-color: #ff80bf;
      box-shadow: 0 0 12px #ff007f;
    }

    .dot.error {
      border-color: #ff3333;
      background: #ff3333;
      box-shadow: 0 0 12px #ff3333;
      animation: shake 0.3s ease-in-out;
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      margin-bottom: 15px;
    }

    .num-btn {
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(6px);
      color: #ffe6f2;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255, 128, 191, 0.3);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    .num-btn:hover {
      background: rgba(255, 0, 127, 0.25);
      border-color: #ff4da6;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
    }

    .num-btn:active {
      transform: scale(0.92);
      background: #ff007f;
      color: white;
      box-shadow: 0 0 20px #ff007f;
    }

    .pin-hint {
      font-size: 12px;
      color: #ffb3da;
      opacity: 0.85;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* ================= GIFT SCREEN ================= */
    #gift-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #3a0025 0%, #12000c 80%);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      overflow-y: auto;
      padding: 30px 10px;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #gift-screen.hide {
      opacity: 0;
      visibility: hidden;
    }

    .gift-box-icon {
      font-size: 90px;
      cursor: pointer;
      animation: bounce 1.2s infinite alternate ease-in-out;
      transition: transform 0.3s;
    }

    .gift-box-icon:hover {
      transform: scale(1.15);
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-20px); }
    }

    .surprise-container {
      display: none;
      flex-direction: column;
      align-items: center;
      animation: pop 0.5s ease;
      width: 100%;
      max-width: 400px;
    }

    /* ================= CAKE ================= */
    .cake-area {
      width: 100%;
      height: 220px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin-top: 5px;
    }

    .cake {
      position: relative;
      width: 240px;
      height: 200px;
    }

    .cake-plate {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 250px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(to bottom, #4a0033, #1a0022);
      border: 1px solid #ff4da6;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
      z-index: 1;
    }

    .cake-body {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: 210px;
      height: 95px;
      background: linear-gradient(135deg, #1f0033, #4a0040, #0f0026);
      border-radius: 12px 12px 20px 20px;
      border: 1px solid rgba(255, 128, 212, 0.3);
      box-shadow: inset 0 0 15px rgba(255, 0, 127, 0.5);
      z-index: 3;
    }

    .cake-top {
      position: absolute;
      left: 50%;
      bottom: 85px;
      transform: translateX(-50%);
      width: 220px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(90deg, #ff007f, #b300ff);
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
      z-index: 6;
    }

    .cream {
      position: absolute;
      background: #ffe6f7;
      box-shadow: 0 0 8px #ff80bf;
      border-radius: 0 0 15px 15px;
      z-index: 9;
    }

    .cream.c1 { width: 28px; height: 23px; left: 10px; top: 0; }
    .cream.c2 { width: 32px; height: 32px; left: 42px; top: 0; }
    .cream.c3 { width: 28px; height: 18px; left: 85px; top: 0; }
    .cream.c4 { width: 32px; height: 30px; left: 125px; top: 0; }
    .cream.c5 { width: 28px; height: 23px; right: 10px; top: 0; }

    .cake-heart {
      position: absolute;
      color: #ffb3da;
      font-size: 14px;
      z-index: 10;
      text-shadow: 0 0 8px #ff007f;
    }

    .ch1 { left: 35px; top: 35px; }
    .ch2 { left: 100px; top: 45px; }
    .ch3 { right: 35px; top: 35px; }

    .strawberry {
      position: absolute;
      z-index: 15;
      font-size: 18px;
      filter: drop-shadow(0 0 8px #ff66cc);
      animation: berryFloat 2.5s ease-in-out infinite;
    }

    .s1 { left: 18px; bottom: 115px; }
    .s2 { left: 60px; bottom: 125px; animation-delay: 0.2s; }
    .s3 { right: 60px; bottom: 125px; animation-delay: 0.4s; }
    .s4 { right: 18px; bottom: 115px; animation-delay: 0.6s; }

    @keyframes berryFloat {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-5px) rotate(3deg); }
    }

    .candle {
      position: absolute;
      left: 50%;
      bottom: 115px;
      transform: translateX(-50%);
      width: 14px;
      height: 55px;
      background: repeating-linear-gradient(
        45deg,
        #ff007f 0,
        #ff007f 6px,
        #fff 6px,
        #fff 12px
      );
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
      z-index: 50;
    }

    .candle::after {
      content: "";
      position: absolute;
      width: 3px;
      height: 8px;
      left: 50%;
      top: -7px;
      transform: translateX(-50%);
      background: #222;
      border-radius: 2px 2px 0 0;
    }

    .flame {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 22px;
      background: radial-gradient(
        ellipse at bottom,
        #fff 0%,
        #ffea00 25%,
        #ff5722 60%,
        rgba(255, 87, 34, 0) 100%
      );
      border-radius: 50% 50% 35% 35%;
      box-shadow:
        0 -5px 15px #ffeb3b,
        0 -10px 25px #ff5722,
        0 0 35px #ff007f;
      animation: realisticFlicker 0.15s infinite alternate ease-in-out;
    }

    .flame.off {
      display: none;
    }

    @keyframes realisticFlicker {
      0% {
        transform: translateX(-50%) scale(1) rotate(-1deg);
        opacity: 0.95;
      }
      100% {
        transform: translateX(-50%) scale(1.08) rotate(1deg);
        opacity: 1;
      }
    }

    /* ================= BUKET ================= */
    .photo-bouquet-wrapper {
      position: relative;
      width: 220px;
      height: 190px;
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .photo-cluster {
      position: absolute;
      top: 0;
      width: 100%;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3;
    }

    .bouquet-photo-item {
      position: absolute;
      width: 75px;
      height: 95px;
      object-fit: cover;
      border: 3px solid #ffb3da;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.6);
      transition: transform 0.3s ease;
    }

    .bouquet-photo-item.p1 {
      transform: rotate(-18deg) translateX(-42px) translateY(5px);
      z-index: 1;
    }

    .bouquet-photo-item.p2 {
      transform: translateY(-10px);
      z-index: 2;
    }

    .bouquet-photo-item.p3 {
      transform: rotate(18deg) translateX(42px) translateY(5px);
      z-index: 1;
    }

    .bouquet-photo-item:hover {
      transform: scale(1.15) rotate(0);
      z-index: 10;
    }

    .bouquet-deco-emoji {
      position: absolute;
      z-index: 6;
      filter: drop-shadow(0 0 6px rgba(255, 0, 127, 0.8));
      animation: emojiFloat 2s ease-in-out infinite alternate;
      user-select: none;
    }

    .be-1 { top: -10px; left: 10px; font-size: 22px; }
    .be-2 { top: -12px; right: 10px; font-size: 22px; animation-delay: 0.3s; }
    .be-3 { top: 35px; left: -15px; font-size: 20px; animation-delay: 0.6s; }
    .be-4 { top: 35px; right: -15px; font-size: 20px; animation-delay: 0.9s; }
    .be-ribbon {
      bottom: 0;
      z-index: 7;
      font-size: 26px;
      filter: drop-shadow(0 0 8px #ff007f);
    }

    @keyframes emojiFloat {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-6px) scale(1.1); }
    }

    .bouquet-base-wrap {
      position: absolute;
      bottom: 0;
      width: 0;
      height: 0;
      border-left: 65px solid transparent;
      border-right: 65px solid transparent;
      border-top: 100px solid #ff007f;
      filter: drop-shadow(0 0 12px rgba(255, 0, 127, 0.6));
      z-index: 4;
    }

    .bouquet-base-wrap::after {
      content: "";
      position: absolute;
      top: -95px;
      left: -50px;
      width: 0;
      height: 0;
      border-left: 50px solid transparent;
      border-right: 50px solid transparent;
      border-top: 80px solid #b300ff;
    }

    .btn-blow,
    .btn-galaxy {
      color: white;
      border: 1px solid #ff80bf;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .btn-blow {
      background: linear-gradient(135deg, #ff007f, #7928ca);
      padding: 9px 22px;
      font-size: 13px;
      margin-top: 10px;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .btn-blow:hover,
    .btn-galaxy:hover {
      transform: scale(1.05);
      box-shadow: 0 0 22px rgba(255, 0, 127, 0.7);
    }

    .btn-blow:active,
    .btn-galaxy:active {
      transform: scale(0.95);
    }

    .btn-galaxy {
      margin-top: 12px;
      padding: 10px 24px;
      font-size: 0.95rem;
      background: linear-gradient(45deg, #ff007f, #ff4da6);
      border: none;
      box-shadow: 0 0 15px #ff007f;
    }

    /* ================= MOBILE ================= */
    @media (max-width: 600px) {
      .ui-header {
        top: 12px;
      }

      .ui-header h1 {
        font-size: 1.65rem;
      }

      .ui-header p {
        font-size: 0.75rem;
      }

      .instruction {
        bottom: 75px;
        font-size: 0.7rem;
      }

      .music-player {
        right: 12px;
        bottom: 12px;
        padding-right: 10px;
      }

      .music-title {
        font-size: 0.72rem;
      }

      .music-artist {
        font-size: 0.6rem;
      }

      .music-cover {
        width: 32px;
        height: 32px;
      }

      .gift-box-icon {
        font-size: 75px;
      }
    }
  </style>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

  <canvas id="confetti-canvas"></canvas>

  <!-- ================= MUSIK ================= -->
  <div class="music-player paused" id="musicPlayer" onclick="toggleMusic()">
    <img class="music-cover" src="cover.jpg" alt="Cover Lagu">
    <div class="music-info">
      <div class="music-title">About You</div>
      <div class="music-artist">The 1975</div>
    </div>
  </div>

  <audio id="bg-music" loop preload="auto">
    <source src="musik.mp3" type="audio/mpeg">
    Browser kamu tidak mendukung audio.
  </audio>

  <!-- ================= PIN ================= -->
  <div id="passkey-screen">
    <div class="pin-container">
      <div class="pin-flower">🌷</div>
      <div class="pin-title">For My girl 💕</div>
      <div class="pin-subtitle">Masukkan kode rahasia</div>

      <div class="pin-dots" id="pinDots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="numpad">
        <button class="num-btn" onclick="pressKey('1')">1</button>
        <button class="num-btn" onclick="pressKey('2')">2</button>
        <button class="num-btn" onclick="pressKey('3')">3</button>
        <button class="num-btn" onclick="pressKey('4')">4</button>
        <button class="num-btn" onclick="pressKey('5')">5</button>
        <button class="num-btn" onclick="pressKey('6')">6</button>
        <button class="num-btn" onclick="pressKey('7')">7</button>
        <button class="num-btn" onclick="pressKey('8')">8</button>
        <button class="num-btn" onclick="pressKey('9')">9</button>
        <button class="num-btn" onclick="pressKey('clear')">✕</button>
        <button class="num-btn" onclick="pressKey('0')">0</button>
        <button class="num-btn" onclick="pressKey('enter')">↵</button>
      </div>

      <div class="pin-hint">Hint: Tanggal lahir kamu 💖</div>
    </div>
  </div>

  <!-- ================= GIFT ================= -->
  <div id="gift-screen">
    <h2 id="giftTitle" style="color:#ffb3da;margin-bottom:10px;text-shadow:0 0 10px #ff007f;text-align:center;">
      Ketuk Kado Untuk Membuka Kejutan 💖
    </h2>

    <div id="giftBox" class="gift-box-icon" onclick="openGift()">🎁</div>

    <div id="surpriseContent" class="surprise-container">

      <div class="cake-area">
        <div class="cake">
          <div class="cake-plate"></div>

          <div class="cake-body">
            <div class="cream c1"></div>
            <div class="cream c2"></div>
            <div class="cream c3"></div>
            <div class="cream c4"></div>
            <div class="cream c5"></div>

            <span class="cake-heart ch1">✨</span>
            <span class="cake-heart ch2">🪐</span>
            <span class="cake-heart ch3">✨</span>
          </div>

          <div class="cake-top"></div>

          <div class="strawberry s1">🌟</div>
          <div class="strawberry s2">🌙</div>
          <div class="strawberry s3">🌟</div>
          <div class="strawberry s4">💖</div>

          <div class="candle">
            <div class="flame" id="flame"></div>
          </div>
        </div>
      </div>

      <button class="btn-blow" onclick="blowCandle()">💨 Tiup Lilin</button>

      <div class="photo-bouquet-wrapper">
        <span class="bouquet-deco-emoji be-1">🌸</span>
        <span class="bouquet-deco-emoji be-2">✨</span>
        <span class="bouquet-deco-emoji be-3">💖</span>
        <span class="bouquet-deco-emoji be-4">🌸</span>

        <div class="photo-cluster">
          <img src="buket1.jpg" alt="Foto Buket 1" class="bouquet-photo-item p1">
          <img src="buket2.jpg" alt="Foto Buket 2" class="bouquet-photo-item p2">
          <img src="buket3.jpg" alt="Foto Buket 3" class="bouquet-photo-item p3">
        </div>

        <div class="bouquet-base-wrap"></div>

        <span class="bouquet-deco-emoji be-ribbon">🎀</span>
      </div>

      <button class="btn-galaxy" onclick="goToGalaxy()">Ayo lihat Galaxy Mini Kita 🌌</button>
    </div>
  </div>

  <!-- ================= GALAXY ================= -->
  <div class="ui-header">
    <h1>HAPPY BIRTHDAY <span>💗</span></h1>
    <p>for you love ✨</p>
  </div>

  <div id="canvas-container"></div>

  <div class="instruction">
    ✨ Tap foto di orbit untuk membuka pesan ✨
  </div>

  <!-- ================= MODAL ================= -->
  <div class="modal" id="modal">
    <div class="card">
      <button class="close-btn" onclick="closeCard()">×</button>
      <img id="cardImage" src="" alt="Photo">
      <h2 id="cardTitle"></h2>
      <p id="cardMessage"></p>
    </div>
  </div>

  <script>
    /* ================= PIN ================= */
    const CORRECT_PIN = "2009";

    let enteredPin = "";

    const passkeyScreen = document.getElementById("passkey-screen");
    const giftScreen = document.getElementById("gift-screen");
    const dots = document.querySelectorAll(".dot");

    /* ================= MUSIK ================= */
    const song = document.getElementById("bg-music");
    const musicPlayer = document.getElementById("musicPlayer");

    song.volume = 0.5;

    function toggleMusic() {
      if (song.paused) {
        song.play()
          .then(() => {
            musicPlayer.classList.remove("paused");
          })
          .catch((error) => {
            console.error("Musik gagal diputar:", error);
            alert("Musik tidak bisa diputar. Pastikan file 'musik.mp3' ada satu folder dengan index.html.");
          });
      } else {
        song.pause();
        musicPlayer.classList.add("paused");
      }
    }

    function playAudio() {
      if (!song) return;

      song.volume = 0.5;

      song.play()
        .then(() => {
          musicPlayer.classList.remove("paused");
        })
        .catch((error) => {
          console.log("Musik belum bisa diputar:", error);
        });
    }

    /* ================= CONFETTI ================= */
    const confettiCanvas = document.getElementById("confetti-canvas");

    const myConfetti = confetti.create(confettiCanvas, {
      resize: true,
      useWorker: true
    });

    /* ================= PIN FUNCTION ================= */
    function pressKey(key) {
      if (key === "clear") {
        enteredPin = enteredPin.slice(0, -1);
      } else if (key === "enter") {
        verifyPin();
        return;
      } else {
        if (enteredPin.length < CORRECT_PIN.length) {
          enteredPin += key;
        }
      }

      updateDots();

      if (
        enteredPin.length === CORRECT_PIN.length &&
        key !== "clear"
      ) {
        setTimeout(verifyPin, 150);
      }
    }

    function updateDots() {
      dots.forEach((dot, index) => {
        if (index < enteredPin.length) {
          dot.classList.add("filled");
        } else {
          dot.classList.remove("filled");
        }

        dot.classList.remove("error");
      });
    }

    function verifyPin() {
      if (enteredPin === CORRECT_PIN) {
        passkeyScreen.classList.add("hide");

        setTimeout(() => {
          passkeyScreen.style.display = "none";
          giftScreen.style.display = "flex";
        }, 800);
      } else {
        dots.forEach((dot) => dot.classList.add("error"));

        setTimeout(() => {
          enteredPin = "";
          updateDots();
        }, 400);
      }
    }

    /* ================= OPEN GIFT ================= */
    function openGift() {
      /*
        Musik diputar setelah klik kado.
        Ini sengaja dilakukan di sini agar browser mengizinkan audio.
      */
      playAudio();

      document.getElementById("giftBox").style.display = "none";

      document.getElementById("giftTitle").textContent =
        "Make a Wish & Tiup Lilinnya! 🎉";

      document.getElementById("surpriseContent").style.display = "flex";
    }

    /* ================= BLOW CANDLE ================= */
    function blowCandle() {
      const flame = document.getElementById("flame");

      if (flame) {
        flame.classList.add("off");
      }

      const duration = 3000;
      const animationEnd = Date.now() + duration;

      const defaults = {
        startVelocity: 30,
        spread: 360,
        ticks: 60,
        zIndex: 99999
      };

      const interval = setInterval(() => {
        const timeLeft = animationEnd - Date.now();

        if (timeLeft <= 0) {
          clearInterval(interval);
          return;
        }

        const particleCount = 50 * (timeLeft / duration);

        myConfetti({
          ...defaults,
          particleCount,
          origin: {
            x: randomInRange(0.1, 0.3),
            y: Math.random() - 0.2
          }
        });

        myConfetti({
          ...defaults,
          particleCount,
          origin: {
            x: randomInRange(0.7, 0.9),
            y: Math.random() - 0.2
          }
        });
      }, 250);
    }

    function randomInRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    /* ================= GO GALAXY ================= */
    function goToGalaxy() {
      playAudio();

      giftScreen.classList.add("hide");

      setTimeout(() => {
        giftScreen.style.display = "none";
      }, 800);
    }

    /* ================= KEYBOARD PIN ================= */
    window.addEventListener("keydown", (e) => {
      if (!passkeyScreen.classList.contains("hide")) {
        if (e.key >= "0" && e.key <= "9") {
          pressKey(e.key);
        } else if (e.key === "Backspace") {
          pressKey("clear");
        } else if (e.key === "Enter") {
          pressKey("enter");
        }
      }
    });

    /* ================= PHOTO DATA ================= */
    const photoData = [
      {
        title: "aku cinta kamu 💕",
        image: "foto-1.png",
        message:
          "selamat bertambah umur sayangkuu ✨"
      },
      {
        title: "Happy Birthday Love🎂",
        image: "foto-2.png",
        message:
          "selamat ulang tahun yaaa! semoga selalu dikelilingi kebahagiaan dan senyum indah. 💗"
      },
      {
        title: "aku sayang kamu❤️",
        image: "foto-3.png",
        message:
          "setiap hari aku selalu sayang kamuuu. 🌷"
      },
      {
        title: "For You 💌",
        image: "foto-4.png",
        message:
          "di antara luasnya galaksi, kamu adalah bintang yang paling terang di hatiku. ✨"
      },
      {
        title: "pesan Lucu 😂",
        image: "foto-5.png",
        message:
          "meskipun tambah umur, tetep aja masih pendek, wkwkkwkwk."
      },
      {
        title: "Thank You 💗",
        image: "foto-6.png",
        message:
          "terima kasih atas segala tawamu. terimakasih sudah cantik setiap hari. ✨"
      }
    ];

    /* ================= THREE.JS ================= */
    const container = document.getElementById("canvas-container");

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(0, 8, 28);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    container.appendChild(renderer.domElement);

    /* ================= CONTROLS ================= */
    const controls = new THREE.OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.enableZoom = true;

    /* ================= LIGHT ================= */
    const ambientLight = new THREE.AmbientLight(
      0xffb3da,
      0.4
    );

    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(
      0xffffff,
      1.2
    );

    dirLight.position.set(15, 20, 15);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;

    scene.add(dirLight);

    const pointLight = new THREE.PointLight(
      0xff007f,
      2,
      30
    );

    pointLight.position.set(0, 0, 0);

    scene.add(pointLight);

    /* ================= STARS ================= */
    const starsGeometry = new THREE.BufferGeometry();

    const starsCount = 1200;

    const starPositions =
      new Float32Array(starsCount * 3);

    for (let i = 0; i < starsCount * 3; i++) {
      starPositions[i] =
        (Math.random() - 0.5) * 200;
    }

    starsGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(
        starPositions,
        3
      )
    );

    const starsMaterial =
      new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.5
      });

    const starField =
      new THREE.Points(
        starsGeometry,
        starsMaterial
      );

    scene.add(starField);

    /* ================= CENTER PLANET ================= */
    const centerGroup =
      new THREE.Group();

    const sphereGeo =
      new THREE.SphereGeometry(
        3.5,
        64,
        64
      );

    const sphereMat =
      new THREE.MeshStandardMaterial({
        color: 0xff007f,
        roughness: 0.3,
        metalness: 0.2,
        emissive: 0x440022
      });

    const centerPlanet =
      new THREE.Mesh(
        sphereGeo,
        sphereMat
      );

    centerPlanet.castShadow = true;
    centerPlanet.receiveShadow = true;

    centerGroup.add(centerPlanet);

    const ringGeo =
      new THREE.RingGeometry(
        4.2,
        5.8,
        64
      );

    const ringMat =
      new THREE.MeshStandardMaterial({
        color: 0xff99dd,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.8,
        roughness: 0.5
      });

    const planetRing =
      new THREE.Mesh(
        ringGeo,
        ringMat
      );

    planetRing.rotation.x =
      Math.PI / 2.5;

    centerGroup.add(planetRing);

    scene.add(centerGroup);

    /* ================= ORBIT RINGS ================= */
    function createOrbitRing(
      radius,
      color,
      rotX,
      rotY
    ) {
      const ringGeo =
        new THREE.RingGeometry(
          radius - 0.05,
          radius + 0.05,
          64
        );

      const ringMat =
        new THREE.MeshBasicMaterial({
          color,
          side: THREE.DoubleSide
        });

      const ring =
        new THREE.Mesh(
          ringGeo,
          ringMat
        );

      ring.rotation.x = rotX;
      ring.rotation.y = rotY;

      scene.add(ring);
    }

    createOrbitRing(
      11,
      0xff0088,
      Math.PI / 2.3,
      0.2
    );

    createOrbitRing(
      14,
      0xff66cc,
      Math.PI / 2.1,
      -0.3
    );

    /* ================= PHOTO ORBIT ================= */
    const photoMeshes = [];
    const textureLoader =
      new THREE.TextureLoader();

    const totalPhotos =
      photoData.length;

    const radius = 17;
    const baseHeight = 6.7;

    photoData.forEach((data, index) => {
      const angle =
        (index / totalPhotos) *
        Math.PI *
        2;

      const x =
        Math.cos(angle) * radius;

      const z =
        Math.sin(angle) * radius;

      textureLoader.load(
        data.image,
        (texture) => {
          const aspect =
            texture.image.width /
            texture.image.height;

          const planeGeo =
            new THREE.PlaneGeometry(
              1,
              1
            );

          const planeMat =
            new THREE.MeshStandardMaterial({
              map: texture,
              side: THREE.DoubleSide,
              roughness: 0.4,
              transparent: true
            });

          const photoMesh =
            new THREE.Mesh(
              planeGeo,
              planeMat
            );

          photoMesh.position.set(
            x,
            Math.sin(angle) * 1.5,
            z
          );

          photoMesh.scale.set(
            baseHeight * aspect,
            baseHeight,
            1
          );

          photoMesh.userData = {
            id: index
          };

          photoMesh.castShadow = true;
          photoMesh.receiveShadow = true;

          scene.add(photoMesh);
          photoMeshes.push(photoMesh);
        },
        undefined,
        () => {
          console.warn(
            "Foto tidak ditemukan:",
            data.image
          );
        }
      );
    });

    /* ================= CLICK PHOTO ================= */
    const raycaster =
      new THREE.Raycaster();

    const mouse =
      new THREE.Vector2();

    window.addEventListener(
      "click",
      (e) => {
        if (
          e.target.closest(".music-player") ||
          e.target.closest(".modal") ||
          e.target.closest("#passkey-screen") ||
          e.target.closest("#gift-screen")
        ) {
          return;
        }

        mouse.x =
          (e.clientX /
            window.innerWidth) *
            2 -
          1;

        mouse.y =
          -(e.clientY /
            window.innerHeight) *
            2 +
          1;

        raycaster.setFromCamera(
          mouse,
          camera
        );

        const intersects =
          raycaster.intersectObjects(
            photoMeshes
          );

        if (intersects.length > 0) {
          const index =
            intersects[0].object
              .userData.id;

          openCard(index);
        }
      }
    );

    /* ================= CARD ================= */
    function openCard(index) {
      const data =
        photoData[index];

      document.getElementById(
        "cardImage"
      ).src = data.image;

      document.getElementById(
        "cardTitle"
      ).textContent = data.title;

      document.getElementById(
        "cardMessage"
      ).textContent = data.message;

      document
        .getElementById("modal")
        .classList.add("active");
    }

    function closeCard() {
      document
        .getElementById("modal")
        .classList.remove("active");
    }

    /* ================= ESC MODAL ================= */
    window.addEventListener(
      "keydown",
      (e) => {
        if (e.key === "Escape") {
          closeCard();
        }
      }
    );

    /* ================= ANIMATION ================= */
    const clock =
      new THREE.Clock();

    function animate() {
      requestAnimationFrame(
        animate
      );

      const elapsedTime =
        clock.getElapsedTime();

      centerGroup.rotation.y =
        elapsedTime * 0.3;

      centerPlanet.rotation.x =
        elapsedTime * 0.1;

      const scale =
        1 +
        Math.sin(
          elapsedTime * 2
        ) *
          0.05;

      centerPlanet.scale.set(
        scale,
        scale,
        scale
      );

      starField.rotation.y =
        elapsedTime * 0.01;

      photoMeshes.forEach(
        (mesh) => {
          mesh.lookAt(
            camera.position
          );
        }
      );

      controls.update();

      renderer.render(
        scene,
        camera
      );
    }

    animate();

    /* ================= RESIZE ================= */
    window.addEventListener(
      "resize",
      () => {
        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );
      }
    );
  </script>
</body>
</html>
